<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="/public/favicon_32x32.png" rel="icon" sizes="32x32">
    <title>Page Not Found</title>
    <style>
      * { -moz-box-sizing: border-box; -webkit-box-sizing: border-box; box-sizing: border-box; }

      ::-moz-selection {
        background: #b3d4fc;
        text-shadow: none;
      }

      ::selection {
        background: #b3d4fc;
        text-shadow: none;
      }

      html {
        padding: 30px 10px;
        height: 100%;
        font-size: 20px;
        line-height: 1.4;
        color: #737373;
        background-color: #f0f0f0;
        background-image: -webkit-linear-gradient(top, #f0f0f0, #ffffff); /* Chrome 10+, Safari 5.1+, iOS 5+ */
        background-image:   -moz-linear-gradient(top, #f0f0f0, #ffffff); /* Firefox 3.6-15 */
        background-image:     -o-linear-gradient(top, #f0f0f0, #ffffff); /* Opera 11.10-12.00 */
        background-image:       linear-gradient(to bottom, #f0f0f0, #ffffff); /* Firefox 16+, IE10, Opera 12.50+ */
        background-image:         -webkit-gradient(linear, left top, left 200, from(#f0f0f0), to(#ffffff)); /* Safari 4+, Chrome */
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      html,
      input {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      body {
        max-width: 560px;
        _width: 560px;
        padding: 30px 20px 50px;
        border: 1px solid #b3b3b3;
        border-radius: 4px;
        margin: 0 auto;
        box-shadow: 0 1px 10px #a7a7a7, inset 0 1px 0 #fff;
        background: #fcfcfc;
      }

      h1 {
        margin: 0 10px;
        font-size: 50px;
        text-align: center;
      }

      h3 {
        margin: 1.5em 0 0.5em;
      }

      p {
        margin: 1em 0;
      }

      ul {
        padding: 0 0 0 40px;
        margin: 1em 0;
      }

      .container {
        max-width: 440px;
        _width: 440px;
        margin: 0 auto;
      }

      #logo {
        display: block;
        margin: auto;
        margin-bottom: 10px;
      }

      /* search */

      #search-container ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #search-container form {
        margin: 0;
      }

      #search-query,
      #search-submit {
        border: 1px solid #bbb;
        font-size: 16px;
        line-height: normal;
        vertical-align: top;
        color: #444;
        border-radius: 2px;
      }

      #search-query {
        width: 220px;
        height: 30px;
        padding: 5px;
        margin: 5px 5px 0 0;
        box-shadow: inset 0 1px 1px #ccc;
      }

      #search-submit {
        display: inline-block;
        height: 32px;
        padding: 0 10px;
        margin: 5px 0 0;
        white-space: nowrap;
        cursor: pointer;
        background-color: #f5f5f5;
        background-image: -webkit-linear-gradient(rgba(255,255,255,0), #f1f1f1);
        background-image: -moz-linear-gradient(rgba(255,255,255,0), #f1f1f1);
        background-image: -ms-linear-gradient(rgba(255,255,255,0), #f1f1f1);
        background-image: -o-linear-gradient(rgba(255,255,255,0), #f1f1f1);
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        *overflow: visible;
        *display: inline;
        *zoom: 1;
      }

      #search-submit:hover,
      #search-submit:focus {
        border-color: #aaa;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        background-color: #f8f8f8;
      }

      #search-query:hover,
      #search-query:focus {
        border-color: #105cb6;
        outline: 0;
        color: #222;
      }

      input::-moz-focus-inner {
        padding: 0;
        border: 0;
      }
    </style>
    <script type="text/javascript">
      var clicky_site_ids = clicky_site_ids || [];
      clicky_site_ids.push(35043);
      (function() {
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.async = true;
        s.src = '//static.getclicky.com/js';
        ( document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0] ).appendChild( s );
      })();
    </script>  
  </head>
  <body>
    <div class="container">
      <a href="https://ipvm.com">
        <img src="/logo.svg" onerror="this.src='/logo.png';this.height='54';this.onerror=null;" id="logo" alt="IPVM" width="216" height="71" />
      </a>

      <h1>Not Found.</h1>
    <p>Sorry, but the page you were trying to view does not exist.</p>
    <p>It looks like this was the result of either:</p>
    <ul>
      <li>a mistyped address</li>
      <li>an out-of-date link</li>
    </ul>
    <div id="search-container">
      <div class="content">
        <h3 class="other-things"><b>Other things to try:</b></h3>
        <ul>
          <li class="search-goog">
          Search <b>ipvm.com</b>:
          <form action="/search" method="get">
            <input type="text" size="40" name="query" id="search-query" value="">
            <input type="submit" value="Search IPVM" id="search-submit">
          </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
